[env.build-docs]
# NOTE: Passing the `is_unversioned` tag speeds up rebuilds in dev env
description = "Build The Docs"
change_dir = "docs"
deps = ["-r {tox_root}{/}docs{/}requirements.txt"]
pass_env = [
    { replace = "ref", of = ["env_run_base", "pass_env"], extend = true },
    "READTHEDOCS*",  # Present @ RTD
]
commands = [
    [
        "{env_python}", "-bb", "-E", "-s", "-I", "-Werror",
        "-m", "sphinx",
        "-j", "auto",
        "-b", "html",
        "{tty:--color:--no-color}",
        "-a",
        "-n",
        "-W", "--keep-going",
        "-T", "-E",
        "-d", "{temp_dir}{/}.doctrees",
        ".",
        { replace = "posargs", default = ["{env_tmp_dir}{/}html", "-t", "is_unversioned"], extend = true },
    ],
]
commands_post = [
    # Print out the output docs dir and a way to serve html:
    [
        "{env_python}", "-bb", "-E", "-s", "-I", "-Werror", "-c", '''
import os
import pathlib

IS_RTD_ENV = os.getenv("READTHEDOCS", "False") == "True"
docs_dir = pathlib.Path(r"{env_dir}") / r"{env_tmp_dir}" / "html"
index_file = docs_dir / "index.html"
docs_url = os.environ["READTHEDOCS_CANONICAL_URL"] if IS_RTD_ENV else f"file://\{index_file\}"
print(f"\nTo open the documentation, run\n\n\tpython3 -Im webbrowser \N\{QUOTATION MARK\}\{docs_url !s\}\N\{QUOTATION MARK\}\n")
if not IS_RTD_ENV:
    print(f"To serve the docs with a local web server, use\n\n\tpython3 -Im http.server --directory \N\{QUOTATION MARK\}\{docs_dir\}\N\{QUOTATION MARK\} 0\n")
''',
    ],
]

[env.clean]
description = "Erase docs and coverage artifacts"
deps = []
skip_install = true
allowlist_externals = ["/bin/sh"]
commands = [
    ["/bin/sh", "-c", "rm -rf {tox_root}/test/coverage/*"],
    ["/bin/sh", "-c", "rm -frv {work_dir}{/}build-docs{/}tmp {temp_dir}{/}.doctrees"],
]
